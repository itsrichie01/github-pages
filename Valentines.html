<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine, Angel?</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            animation: fadeIn 2s ease-in-out;
        }

        h1 {
            font-size: 2.5rem;
            color: #d63447;
            margin-bottom: 20px;
            animation: float 3s infinite ease-in-out;
        }

        p {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 30px;
            animation: slideIn 1.5s ease-in-out;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        #yesBtn {
            background-color: #4CAF50;
            color: white;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .hidden {
            display: none;
        }

        .heart {
            position: absolute;
            top: -10%;
            font-size: 2rem;
            color: #ff4d4d;
            animation: fall 5s linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10%); }
            100% { transform: translateY(110%); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hey Angel, will you be my Valentine?</h1>
        <p>You light up my world like no one else. Every moment with you feels like a dream. Will you make me the happiest person and be my Valentine? 💖</p>
        <div class="buttons">
            <button id="yesBtn">Yes, of course! 💖</button>
            <button id="noBtn">Hmm, let me think...</button>
        </div>
    </div>

    <!-- Falling hearts animation -->
    <div id="heartsContainer"></div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const heartsContainer = document.getElementById('heartsContainer');

        yesBtn.addEventListener('click', () => {
            document.querySelector('.container').innerHTML = `
                <h1>Yay! You made my day, Angel! 💖</h1>
                <p>I promise to cherish every moment with you. Let's make this Valentine's Day unforgettable! 🌹</p>
                <div class="heart-animation">💖💖💖</div>
            `;
            startHearts();
        });

        noBtn.addEventListener('click', () => {
            noBtn.style.position = 'absolute';
            noBtn.style.left = `${Math.random() * 80}%`;
            noBtn.style.top = `${Math.random() * 80}%`;
        });

        function startHearts() {
            for (let i = 0; i < 50; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '💖';
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.animationDuration = `${Math.random() * 3 + 2}s`;
                heartsContainer.appendChild(heart);
            }
        }
    </script>
</body>
</html>
